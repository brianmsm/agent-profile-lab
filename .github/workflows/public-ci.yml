name: Full-reference public release integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contracts:
    name: Offline reference and rights-boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout pinned source tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Bun 1.4.3
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.3"
      - name: Verify source, public evidence and native profile integrity
        run: |
          python3 -B tools/verify_public_release.py
          python3 -B scripts/review_objective_equivalences.py --verify
          python3 -B scripts/test_nan_quota_optimizer.py
          python3 -B tools/test_bfcl_anchor.py
          python3 -B scripts/verify_source_amendment.py
          python3 -B scripts/test_metadata_contracts.py
          python3 -B scripts/test_adversarial_remediation.py
          python3 -B scripts/test_adversarial_trial_plan.py
      - name: Synthetic public boundary regression tests
        run: python3 -B tools/test_public_boundary.py
      - name: Inspect public files and every new historical blob
        env:
          AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B tools/audit_public_distribution.py --history --head "$AUDIT_HEAD"
      - name: Reconstruct original profile decisions and validate native contracts
        run: |
          python3 -B scripts/prepare_data.py
          # No prior mkdir: the validator itself must create report directories in a clean clone.
          python3 -B scripts/validate_profiles.py > /tmp/public-structural-check.json
          test -s validation/profile-baselines.csv
          test -s validation/role-variance.csv
          test -s validation/exhaustive-validation.json
          python3 -B scripts/test_profile_compiler.py
          python3 -B scripts/test_targeted_r3.py
          python3 -B scripts/test_r3b_contracts.py
          python3 -B scripts/test_r3c_attestations.py
          python3 -B scripts/test_r3_history_anchor.py
          python3 -B tools/verify_public_release.py
      - name: Generate compressed, content-addressed public delivery
        run: |
          python3 -B tools/rebuild_delivery.py
          python3 -B tools/verify_public_release.py
      - name: Install frozen frontend dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: TypeScript tests and lint
        working-directory: dashboard
        run: |
          bun run test
          bun run lint
      - name: Build and independently validate the typed snapshot
        working-directory: dashboard
        run: |
          bun run build
          bun -e 'import {validateSnapshot} from "./src/snapshotIO";const s=validateSnapshot(await Bun.file("public/data/snapshot.json").json());if(s.stats.profiles!==2496||s.stats.rows!==33414||s.benchmarks.length!==3241)process.exit(1);'
      - name: Reject unexpected changes to versioned sources
        run: git diff --exit-code
