name: Publish rights-scoped dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/**"
      - "contracts/**"
      - "evaluations/**"
      - "tools/**"
      - "data/**"
      - "catalog/**"
      - "policies/**"
      - "profiles/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-public
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public history, never private data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Set up Bun 1.4.3
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.4.3"
      - name: Enforce public evidence boundary before publication
        run: |
          python3 -B tools/audit_public_distribution.py --history
          python3 -B tools/verify_public_release.py
          python3 -B tools/test_bfcl_anchor.py
          python3 -B scripts/test_r3b_contracts.py
          python3 -B scripts/test_r3d_git_integrity.py
          python3 -B tools/test_public_boundary.py
          python3 -B tools/rebuild_delivery.py
          python3 -B tools/verify_public_release.py
      - name: Build for project Pages subpath
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run lint
          bunx tsc -b
          bunx vite build --base=/agent-profile-lab/
      - name: Stage minimal verified static website
        run: |
          rm dashboard/dist/data/snapshot.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("dashboard/dist")
          html=(root/"index.html").read_text()
          assert '/agent-profile-lab/assets/' in html
          assert 'name="robots" content="noindex' not in html
          delivery=json.loads((root/"data/delivery.json").read_bytes())
          assert len(delivery["parts"])==2
          assert len(list((root/"data/chunks").glob("*.json.gz")))==2
          assert not (root/"data/snapshot.json").exists()
          assert not any(p.is_symlink() for p in root.rglob("*"))
          assert not any(part in p.parts for p in root.rglob("*") for part in ("internal-research", "validation", "evidence", "sources"))
          print("Public Pages: rights-scoped chunks and assets only")
          PY
      - name: Inspect exact staged public Pages artifact
        run: python3 -B tools/audit_public_distribution.py --built dashboard/dist
      - name: Upload public Pages files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4

        with:
          path: dashboard/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish rights-scoped project site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
